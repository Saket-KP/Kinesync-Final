# Run A: Stage 2 trained on real spans and real video kinetics.
run_name: run_A
seed: 1234
kin_source: real
kin_noise: 0.0
jitter_frames: 0
max_len: 128
model: {d: 256, layers: 4, heads: 4, ff: 1024, dropout: 0.1}
optim:
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  batch_size: 16
  grad_clip: 1.0
  max_epochs: 80
  patience: 10        # epochs without val-NLL improvement before stopping
amp: auto             # bf16/fp16 autocast on CUDA, off on CPU
num_workers: 0
