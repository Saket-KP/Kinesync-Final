# KineSync Stage 1 -- fix #2: cross-attention gated on the diffusion timestep.
#
# Byte-for-byte identical to stage1_rcfg.yaml except for out_dir. The change under
# test is in the ARCHITECTURE, not here: timeline/model.py's Block now modulates its
# cross-attention branch with shift/scale/gate from the timestep embedding, where the
# first three runs used a plain ungated `x = x + a`.
#
# Why this is a clean A/B against runs/stage1_rcfg:
#   * same data, same windows, same seed, same steps, same optimiser;
#   * the new modulation is zero-initialised and its gate enters as (1 + g), so at
#     step 0 this model computes exactly what stage1_rcfg computed at step 0.
#     scripts/test_xattn_compat.py asserts that equality exactly, on all three
#     existing checkpoints as well.
# So any difference in the result is attributable to the gating and nothing else.
#
# What it is meant to fix: beat-phase alignment sat at chance in all three earlier
# runs, while scripts/diag_cond_sensitivity.py showed stage1_rcfg does use its audio
# (music moves the prediction 0.76x as much as the noise seed does). The music was
# therefore reaching the model but its reliance on it could not vary with noise
# level -- and where in a beat to place a cut is only usable once the signal is clean
# enough to place anything. Gating lets the model learn that schedule.
#
# Costs 1.18 M parameters (9.22 M -> 10.40 M), 6 layers x 3 x d x d.

data:
  root: data_v2         # the merged v2 release; `data` is the 41-video pilot
  fps: 25               # Stage-1 output grid
  audio_fps: 10         # native rate of onset/flux/chroma/beat_phase/section
  video_fps: 2          # native rate of flow/color_drift/brightness/saturation
  window_s: 10.0
  hop_s: 5.0
  cut_sigma_frames: 2.0 # ~80 ms; peak locations stay exact
  n_sections: 8
  n_cond_ch: 26
  n_out_ch: 5
  min_cuts_per_video: 1

model:
  d_model: 256
  n_layers: 6
  n_heads: 8
  d_ff: 1024
  dropout: 0.1

diffusion:
  timesteps: 1000
  cosine_s: 0.008
  ddim_steps: 50
  cfg_dropout: 0.1      # genre token
  guidance: 2.0
  cond_dropout: 0.1     # drop the rhythm stream, so guidance can amplify it
  guidance_target: cond # guide on the music, not the genre label
  vel_loss_weight: 0.05

train:
  batch_size: 64
  lr: 2.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 20000
  grad_clip: 1.0
  amp: true
  num_workers: 0
  ckpt_every: 1000
  eval_every: 1000
  log_every: 50
  out_dir: runs/stage1_xattn
  normalize: zscore     # stats in data_v2/norm_stats.json (425 train videos)
  seed: 0
